<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Star Clicker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #ffe066;
      letter-spacing: 2px;
    }

    #star-count {
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: #ffe066;
    }

    #planet {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #4fc3f7, #1565c0, #0d1b4b);
      box-shadow: 0 0 40px #4fc3f780, 0 0 80px #1565c040;
      cursor: pointer;
      transition: transform 0.1s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      margin-bottom: 30px;
      position: relative;
    }

    #planet:active {
      transform: scale(0.93);
    }

    .float-star {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      animation: floatUp 1s ease-out forwards;
      z-index: 999;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
    }

    #upgrades {
      width: 100%;
      max-width: 400px;
    }

    #upgrades h2 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: #aaa;
      text-align: center;
    }

    .upgrade-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #1a1a3a;
      border: 2px solid #333;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .upgrade-btn:hover:not(:disabled) {
      background: #2a2a5a;
      border-color: #ffe066;
    }

    .upgrade-btn:disabled {
      opacity: 1;
      cursor: not-allowed;
      background: #0d0d1a;
      border-color: #1a1a2a;
      color: #333;
    }

    .upgrade-btn:disabled .cost {
      color: #333;
    }

    .upgrade-btn .cost {
      color: #ffe066;
      font-weight: bold;
    }

    #auto-info {
      margin-top: 20px;
      color: #888;
      font-size: 0.9rem;
    }

    /* Twinkling background stars */
    .bg-star {
      position: fixed;
      border-radius: 50%;
      background: white;
      animation: twinkle 2s infinite alternate;
      pointer-events: none;
    }

    @keyframes twinkle {
      0%   { opacity: 0.2; }
      100% { opacity: 1; }
    }

    #main-screen {
      position: fixed;
      inset: 0;
      background: #0a0a1a;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    #main-screen.hidden {
      display: none;
    }

    #main-screen .ms-planet {
      font-size: 7rem;
      margin-bottom: 10px;
      animation: floatPlanet 3s ease-in-out infinite alternate;
    }

    @keyframes floatPlanet {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-18px); }
    }

    #main-screen h1 {
      font-size: 3.5rem;
      color: #ffe066;
      text-shadow: 0 0 30px #ffe066, 0 0 60px #ff9900;
      margin-bottom: 6px;
      letter-spacing: 3px;
    }

    #main-screen .tagline {
      color: #888;
      font-size: 1rem;
      margin-bottom: 40px;
    }

    .mode-btn {
      width: 260px;
      padding: 18px 24px;
      margin: 10px;
      border: 2px solid #333;
      border-radius: 16px;
      background: #1a1a3a;
      color: white;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .mode-btn:hover {
      background: #2a2a5a;
      border-color: #ffe066;
      transform: scale(1.04);
    }

    .mode-btn .mode-emoji {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 6px;
    }

    .mode-btn .mode-title {
      font-size: 1.2rem;
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }

    .mode-btn .mode-desc {
      font-size: 0.82rem;
      color: #aaa;
      display: block;
    }

    #win-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    #win-screen.show {
      display: flex;
    }

    #win-screen h1 {
      font-size: 3.5rem;
      color: #ffe066;
      text-shadow: 0 0 40px #ffe066, 0 0 80px #ff9900;
      margin-bottom: 16px;
      animation: pulse 1.5s infinite alternate;
    }

    #win-screen p {
      font-size: 1.3rem;
      color: #ccc;
      margin-bottom: 10px;
      max-width: 500px;
    }

    #win-screen .big-emoji {
      font-size: 6rem;
      margin-bottom: 20px;
      animation: spin 4s linear infinite;
    }

    #win-screen .win-buttons {
      display: flex;
      gap: 16px;
      margin-top: 30px;
    }

    #win-screen button {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #win-screen .btn-keep {
      background: #ffe066;
      color: #000;
    }

    #win-screen .btn-restart {
      background: #aa00ff;
      color: #fff;
    }

    @keyframes pulse {
      0%   { text-shadow: 0 0 20px #ffe066; }
      100% { text-shadow: 0 0 60px #ffe066, 0 0 100px #ff9900; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      pointer-events: none;
      animation: confettiFall linear forwards;
      z-index: 10000;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="cheat-bar" style="display:none;gap:8px;margin-bottom:16px">
    <input id="cheat-input" type="number" placeholder="Add stars..." style="padding:8px 12px;border-radius:8px;border:2px solid #ffe066;background:#1a1a3a;color:white;font-size:1rem;width:160px">
    <button onclick="addCheatStars()" style="padding:8px 16px;border-radius:8px;border:none;background:#ffe066;color:#000;font-weight:bold;cursor:pointer;font-size:1rem">Give me stars!</button>
    <button onclick="resetStars()" style="padding:8px 16px;border-radius:8px;border:none;background:#ff4444;color:#fff;font-weight:bold;cursor:pointer;font-size:1rem">Reset stars</button>
    <button onclick="restartGame()" style="padding:8px 16px;border-radius:8px;border:none;background:#aa00ff;color:#fff;font-weight:bold;cursor:pointer;font-size:1rem">Restart game</button>
  </div>

  <div id="main-screen">
    <div class="ms-planet">🌍</div>
    <h1>⭐ Star Clicker</h1>
    <p class="tagline">Collect stars. Rule the universe.</p>
    <button class="mode-btn" onclick="startGame('regular')">
      <span class="mode-emoji">🏆</span>
      <span class="mode-title">Regular Mode</span>
      <span class="mode-desc">Reach the Magnet Planet to win!</span>
    </button>
    <button class="mode-btn" onclick="startGame('endless')">
      <span class="mode-emoji">♾️</span>
      <span class="mode-title">Endless Mode</span>
      <span class="mode-desc">No finish line — collect forever.</span>
    </button>
  </div>

  <div id="win-screen">
    <div class="big-emoji">💥</div>
    <h1>YOU WIN!</h1>
    <p>You triggered <strong>The Big Bang</strong> and created a whole new universe!</p>
    <p style="color:#ffe066;font-size:1.1rem">You collected more stars than there are in the cosmos. 🌌</p>
    <div class="win-buttons">
      <button class="btn-keep" onclick="closeWinScreen()">Keep Playing</button>
      <button class="btn-restart" onclick="restartGame(); closeWinScreen(); document.getElementById('main-screen').classList.remove('hidden')">Play Again</button>
    </div>
  </div>

  <h1>⭐ Star Clicker</h1>
  <div id="star-count">0 stars</div>
  <div id="planet">🌍</div>

  <div id="upgrades">
    <h2>🪐 Your Planet</h2>
    <div id="planet-upgrades"></div>

    <h2 style="margin-top:20px">Upgrades</h2>
    <button class="upgrade-btn" id="btn-rocket" onclick="buyRocket()">
      <span id="rocket-label">🚀 Rocket #1 — +2 per click</span>
      <span class="cost" id="rocket-cost">50 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-telescope" onclick="buyUpgrade('telescope')">
      <span id="telescope-label">🔭 Telescope #1 — auto +1/sec</span>
      <span class="cost" id="telescope-cost">100 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-satellite" onclick="buyUpgrade('satellite')">
      <span id="satellite-label">🛰️ Satellite #1 — auto +5/sec</span>
      <span class="cost" id="satellite-cost">500 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-blackhole" onclick="buyUpgrade('blackhole')">
      <span id="blackhole-label">🌌 Black Hole #1 — auto +25/sec</span>
      <span class="cost" id="blackhole-cost">2000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-pulsar" onclick="buyUpgrade('pulsar')">
      <span id="pulsar-label">💫 Pulsar #1 — auto +100/sec</span>
      <span class="cost" id="pulsar-cost">8000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-quasar" onclick="buyUpgrade('quasar')">
      <span id="quasar-label">✨ Quasar #1 — auto +500/sec</span>
      <span class="cost" id="quasar-cost">40000 ⭐</span>
    </button>

    <button class="upgrade-btn" id="btn-magnet" onclick="buyClickUpgrade('magnet')">
      <span id="magnet-label">🌟 Star Magnet #1 — +5 per click</span>
      <span class="cost" id="magnet-cost">150 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-comet" onclick="buyClickUpgrade('comet')">
      <span id="comet-label">💫 Comet #1 — +15 per click</span>
      <span class="cost" id="comet-cost">600 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-alien" onclick="buyClickUpgrade('alien')">
      <span id="alien-label">👽 Alien Helper #1 — +40 per click</span>
      <span class="cost" id="alien-cost">2500 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-boots" onclick="buyClickUpgrade('boots')">
      <span id="boots-label">🌙 Moon Boots #1 — +100 per click</span>
      <span class="cost" id="boots-cost">8000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-lightning" onclick="buyClickUpgrade('lightning')">
      <span id="lightning-label">⚡ Lightning Strike #1 — +300 per click</span>
      <span class="cost" id="lightning-cost">30000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-vortex" onclick="buyClickUpgrade('vortex')">
      <span id="vortex-label">🌀 Vortex Beam #1 — +1000 per click</span>
      <span class="cost" id="vortex-cost">120000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-crystal" onclick="buyClickUpgrade('crystal')">
      <span id="crystal-label">🔮 Crystal Wand #1 — +3000 per click</span>
      <span class="cost" id="crystal-cost">500000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-unicorn" onclick="buyClickUpgrade('unicorn')">
      <span id="unicorn-label">🦄 Space Unicorn #1 — +10000 per click</span>
      <span class="cost" id="unicorn-cost">2000000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-diamonddrill" onclick="buyClickUpgrade('diamonddrill')">
      <span id="diamonddrill-label">💎 Diamond Drill #1 — +50000 per click</span>
      <span class="cost" id="diamonddrill-cost">10000000 ⭐</span>
    </button>

    <h2 style="margin-top:20px">🏗️ Space Stations</h2>
    <button class="upgrade-btn" id="btn-station1" onclick="buyStation('station1')">
      <span id="station1-label">🛸 Small Station #1 — auto +10/sec</span>
      <span class="cost" id="station1-cost">300 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-station2" onclick="buyStation('station2')">
      <span id="station2-label">🚀 Big Station #1 — auto +50/sec</span>
      <span class="cost" id="station2-cost">2000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-station3" onclick="buyStation('station3')">
      <span id="station3-label">🌠 Mega Station #1 — auto +200/sec</span>
      <span class="cost" id="station3-cost">10000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-robot" onclick="buyStation('robot')">
      <span id="robot-label">🤖 Star Robot #1 — auto +500/sec</span>
      <span class="cost" id="robot-cost">50000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-castle" onclick="buyStation('castle')">
      <span id="castle-label">🏰 Star Castle #1 — auto +2000/sec</span>
      <span class="cost" id="castle-cost">200000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-solar" onclick="buyStation('solar')">
      <span id="solar-label">🌞 Solar Array #1 — auto +8000/sec</span>
      <span class="cost" id="solar-cost">1000000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-dnalab" onclick="buyStation('dnalab')">
      <span id="dnalab-label">🧬 DNA Lab #1 — auto +35000/sec</span>
      <span class="cost" id="dnalab-cost">6000000 ⭐</span>
    </button>
    <button class="upgrade-btn" id="btn-fortress" onclick="buyStation('fortress')">
      <span id="fortress-label">🏯 Galaxy Fortress #1 — auto +150000/sec</span>
      <span class="cost" id="fortress-cost">30000000 ⭐</span>
    </button>
  </div>

  <div id="auto-info"></div>

  <script>
    let kPresses = 0, kTimer = null;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'k') {
        kPresses++;
        clearTimeout(kTimer);
        kTimer = setTimeout(() => kPresses = 0, 600);
        if (kPresses >= 5) {
          kPresses = 0;
          const bar = document.getElementById('cheat-bar');
          bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
        }
      }
    });

    function resetStars() {
      stars = 0;
      updateDisplay();
    }

    function restartGame() {
      stars = 0;
      clickPower = 1;
      autoRate = 0;
      planetLevel = 0;

      // Reset planet
      const p = document.getElementById('planet');
      p.textContent = '🌍';
      p.style.width = '200px';
      p.style.height = '200px';

      // Reset rocket
      rocketCount = 0;
      rocketCost = 50;
      document.getElementById('rocket-label').textContent = '🚀 Rocket #1 — +2 per click';
      document.getElementById('rocket-cost').textContent = '50 ⭐';

      // Reset click upgrades
      clickUpgrades.magnet      = { count: 0, cost: 150,      bonus: 5,     costMult: 2.5, label: '🌟 Star Magnet' };
      clickUpgrades.comet       = { count: 0, cost: 600,      bonus: 15,    costMult: 2.5, label: '💫 Comet' };
      clickUpgrades.alien       = { count: 0, cost: 2500,     bonus: 40,    costMult: 2.5, label: '👽 Alien Helper' };
      clickUpgrades.boots       = { count: 0, cost: 8000,     bonus: 100,   costMult: 2.5, label: '🌙 Moon Boots' };
      clickUpgrades.lightning   = { count: 0, cost: 30000,    bonus: 300,   costMult: 2.5, label: '⚡ Lightning Strike' };
      clickUpgrades.vortex      = { count: 0, cost: 120000,   bonus: 1000,  costMult: 2.5, label: '🌀 Vortex Beam' };
      clickUpgrades.crystal     = { count: 0, cost: 500000,   bonus: 3000,  costMult: 2.5, label: '🔮 Crystal Wand' };
      clickUpgrades.unicorn     = { count: 0, cost: 2000000,  bonus: 10000, costMult: 2.5, label: '🦄 Space Unicorn' };
      clickUpgrades.diamonddrill= { count: 0, cost: 10000000, bonus: 50000, costMult: 2.5, label: '💎 Diamond Drill' };
      for (const [name, u] of Object.entries(clickUpgrades)) {
        document.getElementById(name + '-label').textContent = `${u.label} #1 — +${u.bonus} per click`;
        document.getElementById(name + '-cost').textContent = u.cost.toLocaleString() + ' ⭐';
      }

      // Reset stations
      stations.station1 = { count: 0, cost: 300,      rate: 10,     costMult: 2 };
      stations.station2 = { count: 0, cost: 2000,     rate: 50,     costMult: 2 };
      stations.station3 = { count: 0, cost: 10000,    rate: 200,    costMult: 2 };
      stations.robot    = { count: 0, cost: 50000,    rate: 500,    costMult: 2 };
      stations.castle   = { count: 0, cost: 200000,   rate: 2000,   costMult: 2 };
      stations.solar    = { count: 0, cost: 1000000,  rate: 8000,   costMult: 2 };
      stations.dnalab   = { count: 0, cost: 6000000,  rate: 35000,  costMult: 2 };
      stations.fortress = { count: 0, cost: 30000000, rate: 150000, costMult: 2 };
      for (const [name, s] of Object.entries(stations)) {
        document.getElementById(name + '-label').textContent = `${stationNames[name]} #1 — auto +${s.rate}/sec`;
        document.getElementById(name + '-cost').textContent = s.cost.toLocaleString() + ' ⭐';
      }

      // Reset auto upgrades
      upgrades.telescope = { count: 0, cost: 100,   rate: 1,   costMult: 2, label: '🔭 Telescope' };
      upgrades.satellite = { count: 0, cost: 500,   rate: 5,   costMult: 2, label: '🛰️ Satellite' };
      upgrades.blackhole = { count: 0, cost: 2000,  rate: 25,  costMult: 2, label: '🌌 Black Hole' };
      upgrades.pulsar    = { count: 0, cost: 8000,  rate: 100, costMult: 2, label: '💫 Pulsar' };
      upgrades.quasar    = { count: 0, cost: 40000, rate: 500, costMult: 2, label: '✨ Quasar' };
      for (const [name, u] of Object.entries(upgrades)) {
        document.getElementById('btn-' + name).disabled = false;
        document.getElementById(name + '-label').textContent = `${u.label} #1 — auto +${u.rate}/sec`;
        document.getElementById(name + '-cost').textContent = u.cost.toLocaleString() + ' ⭐';
      }

      renderPlanetUpgrades();
      updateDisplay();
    }

    function showWinScreen() {
      document.getElementById('win-screen').classList.add('show');
      launchConfetti();
    }

    function closeWinScreen() {
      document.getElementById('win-screen').classList.remove('show');
    }

    function launchConfetti() {
      const colors = ['#ffe066','#ff9900','#ff4444','#44ff88','#44ccff','#cc44ff','#ffffff'];
      for (let i = 0; i < 120; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.left = Math.random() * 100 + 'vw';
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.width = (6 + Math.random() * 10) + 'px';
          el.style.height = (6 + Math.random() * 10) + 'px';
          el.style.animationDuration = (2 + Math.random() * 3) + 's';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 5000);
        }, i * 30);
      }
    }

    function addCheatStars() {
      const amount = parseInt(document.getElementById('cheat-input').value);
      if (!amount || amount < 1) return;
      stars += amount;
      updateDisplay();
    }

    let gameMode = 'regular';

    function startGame(mode) {
      gameMode = mode;
      document.getElementById('main-screen').classList.add('hidden');
      updateDisplay();
    }

    let stars = 0;
    let clickPower = 1;
    let autoRate = 0;
    let planetLevel = 0;

    const planets = [
      { emoji: '🌍', name: 'Earth',       cost: 0,         bonus: '',                size: 200 },
      { emoji: '🌙', name: 'Moon',        cost: 200,       bonus: '+3 per click',    size: 110 },
      { emoji: '🔴', name: 'Mars',        cost: 1000,      bonus: '+10 per click',   size: 160 },
      { emoji: '🔵', name: 'Neptune',     cost: 3000,      bonus: '+20 per click',   size: 210 },
      { emoji: '🟠', name: 'Jupiter',     cost: 8000,      bonus: '+40 per click',   size: 280 },
      { emoji: '🪐', name: 'Saturn',      cost: 20000,     bonus: '+80 per click',   size: 310 },
      { emoji: '☀️', name: 'The Sun',     cost: 60000,     bonus: '+200 per click',  size: 360 },
      { emoji: '💥', name: 'Supernova',   cost: 200000,    bonus: '+500 per click',  size: 400 },
      { emoji: '⚫', name: 'Black Hole',  cost: 800000,    bonus: '+1000 per click', size: 340 },
      { emoji: '🌌', name: 'Galaxy',      cost: 3000000,   bonus: '+5000 per click', size: 420 },
      { emoji: '🌀', name: 'Milky Way',   cost: 10000000,  bonus: '+15000 per click',size: 440 },
      { emoji: '🔮', name: 'Nebula',      cost: 40000000,  bonus: '+40000 per click',size: 390 },
      { emoji: '🌠', name: 'Universe',    cost: 150000000, bonus: '+100000 per click',size: 460 },
      { emoji: '✨', name: 'Multiverse',   cost: 600000000,   bonus: '+500000 per click',  size: 480 },
      { emoji: '🕸️', name: 'Cosmic Web',  cost: 2000000000,  bonus: '+2000000 per click', size: 500 },
      { emoji: '🌊', name: 'The Void',    cost: 8000000000,  bonus: '+8000000 per click', size: 460 },
      { emoji: '💠', name: 'Dimension X', cost: 30000000000, bonus: '+30000000 per click',size: 510 },
      { emoji: '👁️', name: 'Eye of God',    cost: 100000000000,   bonus: '+100000000 per click',   size: 520 },
      { emoji: '🌪️', name: 'Wormhole',      cost: 400000000000,   bonus: '+400000000 per click',   size: 490 },
      { emoji: '🧊', name: 'Ice Planet',    cost: 1500000000000,  bonus: '+1500000000 per click',  size: 530 },
      { emoji: '🔥', name: 'Lava Planet',   cost: 6000000000000,  bonus: '+6000000000 per click',  size: 540 },
      { emoji: '👾', name: 'Alien World',   cost: 25000000000000, bonus: '+25000000000 per click', size: 550 },
      { emoji: '🌈', name: 'Rainbow Nebula',cost: 100000000000000,bonus: '+100000000000 per click',size: 560 },
      { emoji: '💀', name: 'Dead Star',     cost: 400000000000000,bonus: '+400000000000 per click',size: 510 },
      { emoji: '🧲', name: 'Magnet Planet',    cost: 2e15,  bonus: '+2T per click',      size: 570 },
      { emoji: '🌟', name: 'Star Forge',        cost: 1e16,  bonus: '+10T per click',     size: 580 },
      { emoji: '🔷', name: 'Crystal World',     cost: 5e16,  bonus: '+50T per click',     size: 590 },
      { emoji: '☄️',  name: 'Comet Core',        cost: 2.5e17,bonus: '+250T per click',    size: 580 },
      { emoji: '🧿', name: 'Mind Sphere',       cost: 1.5e18,bonus: '+1.5Q per click',    size: 600 },
      { emoji: '🌺', name: 'Bloom World',       cost: 8e18,  bonus: '+8Q per click',      size: 610 },
      { emoji: '🦋', name: 'Butterfly Nebula',  cost: 4e19,  bonus: '+40Q per click',     size: 600 },
      { emoji: '🔱', name: 'Trident Star',      cost: 2e20,  bonus: '+200Q per click',    size: 620 },
      { emoji: '🌑', name: 'Shadow Realm',      cost: 1e21,  bonus: '+1 Qn per click',    size: 630 },
      { emoji: '🔴', name: 'Red Giant',         cost: 5e21,  bonus: '+5 Qn per click',    size: 640 },
      { emoji: '💥', name: 'The Big Bang',       cost: 3e22,  bonus: '+30 Qn per click',   size: 660 },
    ];

    const clickBonuses = [0, 3, 10, 20, 40, 80, 200, 500, 1000, 5000, 15000, 40000, 100000, 500000, 2000000, 8000000, 30000000, 100000000, 400000000, 1500000000, 6000000000, 25000000000, 100000000000, 400000000000, 2000000000000, 10000000000000, 50000000000000, 250000000000000, 1500000000000000, 8000000000000000, 40000000000000000, 200000000000000000, 1000000000000000000, 5000000000000000000, 30000000000000000000];

    function renderPlanetUpgrades() {
      const container = document.getElementById('planet-upgrades');
      container.innerHTML = '';
      const next = planets[planetLevel + 1];
      if (!next) {
        container.innerHTML = '<p style="text-align:center;color:#ffe066">You have the most powerful planet! 🎉</p>';
        return;
      }
      const btn = document.createElement('button');
      btn.className = 'upgrade-btn';
      btn.id = 'btn-planet';
      btn.innerHTML = `<span>${next.emoji} Upgrade to ${next.name} — ${next.bonus}</span><span class="cost">${next.cost.toLocaleString()} ⭐</span>`;
      btn.disabled = stars < next.cost;
      btn.onclick = () => {
        if (stars < next.cost) return;
        stars -= next.cost;
        planetLevel++;
        clickPower += clickBonuses[planetLevel];
        const p = document.getElementById('planet');
        p.textContent = planets[planetLevel].emoji;
        p.style.width = planets[planetLevel].size + 'px';
        p.style.height = planets[planetLevel].size + 'px';
        renderPlanetUpgrades();
        updateDisplay();
        if (gameMode === 'regular' && planetLevel === planets.length - 1) showWinScreen();
      };
      container.appendChild(btn);
    }

    const clickUpgrades = {
      magnet:    { count: 0, cost: 150,   bonus: 5,   costMult: 2.5, label: '🌟 Star Magnet' },
      comet:     { count: 0, cost: 600,   bonus: 15,  costMult: 2.5, label: '💫 Comet' },
      alien:     { count: 0, cost: 2500,  bonus: 40,  costMult: 2.5, label: '👽 Alien Helper' },
      boots:       { count: 0, cost: 8000,     bonus: 100,   costMult: 2.5, label: '🌙 Moon Boots' },
      lightning:   { count: 0, cost: 30000,    bonus: 300,   costMult: 2.5, label: '⚡ Lightning Strike' },
      vortex:      { count: 0, cost: 120000,   bonus: 1000,  costMult: 2.5, label: '🌀 Vortex Beam' },
      crystal:     { count: 0, cost: 500000,   bonus: 3000,  costMult: 2.5, label: '🔮 Crystal Wand' },
      unicorn:     { count: 0, cost: 2000000,  bonus: 10000, costMult: 2.5, label: '🦄 Space Unicorn' },
      diamonddrill:{ count: 0, cost: 10000000, bonus: 50000, costMult: 2.5, label: '💎 Diamond Drill' },
    };

    function buyClickUpgrade(name) {
      const u = clickUpgrades[name];
      if (stars < u.cost) return;
      stars -= u.cost;
      u.count++;
      clickPower += u.bonus;
      u.cost = Math.floor(u.cost * u.costMult);
      document.getElementById(name + '-label').textContent = `${u.label} #${u.count + 1} — +${u.bonus} per click`;
      document.getElementById(name + '-cost').textContent = u.cost.toLocaleString() + ' ⭐';
      updateDisplay();
    }

    let rocketCount = 0;
    let rocketCost = 50;

    const stations = {
      station1: { count: 0, cost: 300,    rate: 10,   costMult: 2 },
      station2: { count: 0, cost: 2000,   rate: 50,   costMult: 2 },
      station3: { count: 0, cost: 10000,  rate: 200,  costMult: 2 },
      robot:    { count: 0, cost: 50000,    rate: 500,    costMult: 2 },
      castle:   { count: 0, cost: 200000,   rate: 2000,   costMult: 2 },
      solar:    { count: 0, cost: 1000000,  rate: 8000,   costMult: 2 },
      dnalab:   { count: 0, cost: 6000000,  rate: 35000,  costMult: 2 },
      fortress: { count: 0, cost: 30000000, rate: 150000, costMult: 2 },
    };
    const stationNames = { station1: '🛸 Small Station', station2: '🚀 Big Station', station3: '🌠 Mega Station', robot: '🤖 Star Robot', castle: '🏰 Star Castle', solar: '🌞 Solar Array', dnalab: '🧬 DNA Lab', fortress: '🏯 Galaxy Fortress' };

    function buyStation(name) {
      const s = stations[name];
      if (stars < s.cost) return;
      stars -= s.cost;
      s.count++;
      autoRate += s.rate;
      s.cost = Math.floor(s.cost * s.costMult);
      document.getElementById(name + '-label').textContent = `${stationNames[name]} #${s.count + 1} — auto +${s.rate}/sec`;
      document.getElementById(name + '-cost').textContent = s.cost.toLocaleString() + ' ⭐';
      updateDisplay();
    }

    const upgrades = {
      telescope: { count: 0, cost: 100,   rate: 1,   costMult: 2, label: '🔭 Telescope' },
      satellite: { count: 0, cost: 500,   rate: 5,   costMult: 2, label: '🛰️ Satellite' },
      blackhole: { count: 0, cost: 2000,  rate: 25,  costMult: 2, label: '🌌 Black Hole' },
      pulsar:    { count: 0, cost: 8000,  rate: 100, costMult: 2, label: '💫 Pulsar' },
      quasar:    { count: 0, cost: 40000, rate: 500, costMult: 2, label: '✨ Quasar' },
    };

    const planet = document.getElementById('planet');
    const starCount = document.getElementById('star-count');
    const autoInfo = document.getElementById('auto-info');

    renderPlanetUpgrades();

    // Background stars
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'bg-star';
      const size = Math.random() * 3 + 1;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        top:${Math.random()*100}vh;
        left:${Math.random()*100}vw;
        animation-delay:${Math.random()*2}s;
        animation-duration:${1+Math.random()*2}s;
      `;
      document.body.appendChild(s);
    }

    planet.addEventListener('click', (e) => {
      stars += clickPower;
      updateDisplay();
      spawnStar(e.clientX, e.clientY);
    });

    function spawnStar(x, y) {
      const el = document.createElement('div');
      el.className = 'float-star';
      el.textContent = '+' + clickPower + '⭐';
      el.style.left = (x - 20) + 'px';
      el.style.top  = (y - 20) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function buyRocket() {
      if (stars < rocketCost) return;
      stars -= rocketCost;
      rocketCount++;
      clickPower += 2;
      rocketCost = Math.floor(rocketCost * 2);
      document.getElementById('rocket-label').textContent = `🚀 Rocket #${rocketCount + 1} — +2 per click`;
      document.getElementById('rocket-cost').textContent = rocketCost.toLocaleString() + ' ⭐';
      updateDisplay();
    }

    function buyUpgrade(name) {
      const u = upgrades[name];
      if (stars < u.cost) return;
      stars -= u.cost;
      u.count++;
      autoRate += u.rate;
      u.cost = Math.floor(u.cost * u.costMult);
      document.getElementById(name + '-label').textContent = `${u.label} #${u.count + 1} — auto +${u.rate}/sec`;
      document.getElementById(name + '-cost').textContent = u.cost.toLocaleString() + ' ⭐';
      updateDisplay();
    }

    function updateDisplay() {
      starCount.textContent = Math.floor(stars).toLocaleString() + ' stars';
      autoInfo.textContent = autoRate > 0 ? `Auto collecting ${autoRate} stars/sec` : '';

      document.getElementById('btn-rocket').disabled = stars < rocketCost;

      const planetBtn = document.getElementById('btn-planet');
      if (planetBtn) planetBtn.disabled = stars < planets[planetLevel + 1]?.cost;

      for (const [name, u] of Object.entries(upgrades)) {
        document.getElementById('btn-' + name).disabled = stars < u.cost;
      }

      for (const [name, s] of Object.entries(stations)) {
        document.getElementById('btn-' + name).disabled = stars < s.cost;
      }

      for (const [name, u] of Object.entries(clickUpgrades)) {
        document.getElementById('btn-' + name).disabled = stars < u.cost;
      }
    }

    // Auto clicker
    setInterval(() => {
      if (autoRate > 0) {
        stars += autoRate / 20;
        updateDisplay();
      }
    }, 50);
  </script>
</body>
</html>
